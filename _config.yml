title: solids4foam
description: solids4foam allows solid mechanics and fluid-solid interaction simulations to performed natively within OpenFOAM

theme: null

# debug:
#   compress: true
#   dist: false
#   shortcodes: true

readme_index:
  with_frontmatter: true

plugins:
  - jemoji
  - jekyll-avatar
  - jekyll-mentions
  - jekyll-redirect-from

exclude:
  - Makefile
  - CNAME
  - LICENSE
  - update.sh
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - node_modules
  - package.json
  - package-lock.json
  - webpack.config.js
  - jekyll-rtd-theme.gemspec
  - imported

# Files published from solids4foam that other pages embed rather than link
# to; see bin/docs-manifest.txt.
collections:
  snippets:
    output: false

# Front matter for pages published from solids4foam, whose files cannot carry
# site-specific values. A page's own front matter still takes precedence.
defaults:
  - scope:
      path: about/contributing/README.md
    values:
      title: How to contribute
  - scope:
      path: about/contributing/code-of-conduct.md
    values:
      title: Code of conduct

# BEGIN generated by bin/sync-docs.sh; do not edit.
# The pages published from solids4foam: their relative links are
# rewritten from _data/docs_links.yml instead.
